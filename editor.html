<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>microKORG XL · Ostinato</title>
  <link rel="stylesheet" href="style.css">
  <!-- These pages run inside index.html, which keeps both alive so playback never stops. -->
  <script>if (top === self) location.replace('index.html' + location.search + '#editor');</script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">O</span>
      <span class="brand-name">Ostinato</span>
      <nav class="app-nav" aria-label="Switch view">
        <a href="index.html#editor" data-view="editor" aria-current="page">microKORG XL</a>
        <a href="index.html#sequencer" data-view="sequencer">Sequencer</a>
        <a href="index.html#lab" data-view="lab">Lab</a>
      </nav>
    </div>
    <div class="midi-setup">
      <label>In <select id="midi-in"></select></label>
      <label>Out <select id="midi-out"></select></label>
      <label>Ch <select id="midi-ch"></select></label>
      <label title="Whole program: resends the full patch on each edit — always works. Parameter: sends just the changed value — smoother while notes are held.">Send
        <select id="send-mode">
          <option value="dump">Whole program</option>
          <option value="param">Parameter</option>
        </select>
      </label>
      <button id="btn-connect" class="ghost">Find synth</button>
      <span id="conn-status" class="status-pill">No MIDI</span>
    </div>
  </header>

  <section class="program-bar">
    <div class="program-id">
      <span id="slot-label" class="slot">--</span>
      <input id="prog-name" maxlength="8" spellcheck="false" autocomplete="off" aria-label="Program name">
      <span id="voicing" class="vbadge"></span>
      <span id="dirty-flag" class="dirty" hidden>edited</span>
    </div>
    <div class="program-actions">
      <button id="btn-get" title="Read the program currently selected on the synth">Get from synth</button>
      <button id="btn-send" title="Send this program to the synth's edit buffer (doesn't save)">Send to synth</button>
      <button id="btn-write" class="accent" title="Save this program into one of the synth's 128 slots">Write to slot…</button>
      <button id="btn-mine" title="Keep this sound in your My Sounds collection on this computer">Add to My Sounds</button>
      <span class="sep"></span>
      <button id="btn-load" class="ghost">Open .syx</button>
      <button id="btn-save" class="ghost">Save .syx</button>
      <button id="btn-init" class="ghost" title="Start from a basic saw patch">Init</button>
      <input id="file-input" type="file" accept=".syx,.SYX,.mkxl_all,.mkxlp_all,application/octet-stream" hidden>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="presets">Presets</button>
    <button role="tab" data-tab="ai">AI Designer</button>
    <button role="tab" data-tab="t1" aria-selected="true">Timbre 1</button>
    <button role="tab" data-tab="t2">Timbre 2</button>
    <button role="tab" data-tab="fx">Effects</button>
    <button role="tab" data-tab="arp">Program &amp; Arp</button>
    <button role="tab" data-tab="voc">Vocoder</button>
    <button role="tab" data-tab="lib">Library</button>
    <button role="tab" data-tab="log">MIDI Log</button>
    <button role="tab" data-tab="help">Help</button>
  </nav>

  <main id="view"></main>

  <footer class="keys-bar">
    <div id="keyboard" class="keyboard" aria-label="Audition keyboard"></div>
    <div class="keys-hint">Play with your computer keys: <kbd>A</kbd>–<kbd>K</kbd> white, <kbd>W</kbd> <kbd>E</kbd> <kbd>T</kbd> <kbd>Y</kbd> <kbd>U</kbd> black, <kbd>Z</kbd>/<kbd>X</kbd> octave</div>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="write-dialog">
    <form method="dialog">
      <h2>Write to slot</h2>
      <p>This overwrites the program stored in the chosen slot on the synth.</p>
      <label>Slot <select id="write-slot"></select></label>
      <menu>
        <button value="cancel" class="ghost">Cancel</button>
        <button value="ok" class="accent">Write</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="js/xl/app.js"></script>
  <script type="module" src="js/core/topbar.js"></script>
</body>
</html>
